photo: 20260404_204704_04f01b.jpg
recipe_title: Slow-Roasted Sunday Chicken

headnote: |
  If ever there were a dish worthy of a Sunday dinner, this is it. Nothing is
  cozier than the smell of a slow-roasting chicken. No matter how old I get, it
  always brings me back to when my mom would roast one on Sundays (in addition
  to baking her chocolate chip cookies). She served it up with a buttery side
  dish, usually potatoes but sometimes rice. And bread. Always bread. So that
  got me thinking—what's the only thing that could possibly make a Sunday
  chicken better? A side of buttery, lemony orzo cooked directly alongside,
  making this hearty dinner a complete one-and-done. Yes, it takes a few hours,
  but that time is almost completely hands-off, nothing fancy, and the outcome
  is always stunning . . . and, of course, delicious. Serve it Gerard-family
  style, straight from the pot, for a perfect dinner that impresses and
  satisfies everyone. Don't worry, no one needs to know how stinkin' easy it
  was to make.

